<style>
:root{--blue:#0C447C;--blue-dark:#042C53;--blue-tint:#E6F1FB;--blue-tint-2:#B5D4F4;--gold-dark:#854F0B;--ink:#0f1a24;--body:#3a4a5a;--muted:#5a6a7a;--line:#e4eaef;--bg-soft:#f7f9fb;--gold-tint:#f6efdd;--gold:#9a7420}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--bg-soft);color:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(15,26,36,.12);max-width:420px;width:100%;padding:34px 32px 30px;text-align:center}
h1{font-family:"Newsreader",Georgia,serif;font-size:22px;color:var(--ink);font-weight:600;margin:14px 0 6px}
h1 .m{color:var(--blue)}h1 .p{color:var(--gold-dark)}
p{font-size:13.5px;margin:0 0 18px;line-height:1.55}
input{width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.06em;text-align:center;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink)}
input:focus{outline:2px solid var(--blue-tint-2);border-color:var(--blue)}
button{width:100%;margin-top:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
button:hover{background:var(--blue-dark)}
button:disabled{opacity:.5;cursor:wait}
.err{display:none;background:#F9E9E7;color:#a33d2e;border-radius:8px;padding:9px;font-size:12.5px;margin-top:10px}
.note{font-size:12px;color:var(--muted);margin-top:16px;margin-bottom:0}
.note a{color:var(--blue);text-decoration:none}
</style>

const SALT = "ppFq3ZhN6lBpwz7/SwESOA==";
const IV = "KbhocB6WsQaSBT6Y";
const ITER = 310000;
function b64ToBytes(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function unlock(){
  const code = document.getElementById("code").value.trim();
  if(!code) return;
  const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Unlocking\u2026";

    const enc = new TextEncoder();
